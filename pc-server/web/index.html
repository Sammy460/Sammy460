<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PhoneDeck</title>
<style>
  :root { --bg: #0a0b0f; --card: #16181f; --accent: #3da9fc; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #grid { display: grid; gap: 14px; padding: 14px; flex: 1; min-height: 0; }
  .btn { border: 0; border-radius: 22px; color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -2px 6px rgba(0,0,0,.3);
    transition: transform .09s ease, filter .09s; min-height: 0; }
  .btn::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.18), transparent 45%); }
  .btn .icon { font-size: clamp(28px, 7vmin, 60px); line-height: 1; z-index: 1; }
  .btn .label { z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .btn:active, .btn.pressed { transform: scale(.93); filter: brightness(1.3); }
  .btn.err { outline: 3px solid #ff4d4d; }

  /* ---- Now Playing (Steam-Deck-Stil) ---- */
  #np { display: none; margin: 14px 14px 0; border-radius: 24px; position: relative;
    overflow: hidden; background: var(--card);
    box-shadow: 0 10px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
  #np.show { display: block; }
  #np .bg { position: absolute; inset: 0; background-size: cover; background-position: center;
    filter: blur(40px) brightness(.45) saturate(1.3); transform: scale(1.6); }
  #np .inner { position: relative; display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; }
  #np .art { width: 76px; height: 76px; border-radius: 16px; background: #000;
    background-size: cover; background-position: center; flex: 0 0 auto;
    box-shadow: 0 6px 18px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08); }
  #np .meta { flex: 1; min-width: 0; }
  #np .t { font-weight: 800; font-size: 17px; letter-spacing: .2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .a { font-size: 14px; color: #c3c7d1; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .ctrl { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  #np .ctrl button { border: 0; color: #fff; display: flex; align-items: center;
    justify-content: center; background: rgba(255,255,255,.12);
    width: 50px; height: 50px; border-radius: 50%; font-size: 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15); transition: transform .08s, background .08s; }
  #np .ctrl #npplay { width: 62px; height: 62px; font-size: 26px;
    background: var(--accent); color: #04121f; box-shadow: 0 6px 16px rgba(61,169,252,.5); }
  #np .ctrl button:active { transform: scale(.88); background: rgba(255,255,255,.26); }
  #np .bar { position: relative; height: 4px; background: rgba(255,255,255,.12); }
  #np .bar > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--accent); transition: width .5s linear; }

  #offline { position: fixed; inset: 0; background: var(--bg); display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #8a8f9c; }
  #offline.show { display: flex; }
  #offline .dot { width: 16px; height: 16px; border-radius: 50%; background: #444;
    animation: pulse 1.4s infinite; }
  #offline .big { font-size: 18px; font-weight: 600; }
  @keyframes pulse { 50% { background: var(--accent); } }
</style>
</head>
<body>
<div id="app">
  <div id="np">
    <div class="bg" id="npbg"></div>
    <div class="inner">
      <div class="art" id="npart"></div>
      <div class="meta"><div class="t" id="npt">—</div><div class="a" id="npa"></div></div>
      <div class="ctrl">
        <button data-cmd="prev">⏮</button>
        <button data-cmd="playpause" id="npplay">▶</button>
        <button data-cmd="next">⏭</button>
      </div>
    </div>
    <div class="bar"><i id="npbar"></i></div>
  </div>
  <div id="grid"></div>
</div>
<div id="offline"><div class="dot"></div><div class="big">Warte auf PC …</div></div>
<script>
  const grid = document.getElementById("grid");
  const offline = document.getElementById("offline");
  const np = document.getElementById("np");
  let showNp = true;

  async function loadDeck() {
    const deck = await (await fetch("/api/deck", { cache: "no-store" })).json();
    if (deck.error) { grid.textContent = deck.error; return; }
    showNp = deck.nowPlaying !== false;
    const cols = deck.columns || 4;
    const rows = Math.ceil(deck.buttons.length / cols) || 1;
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    grid.innerHTML = "";
    deck.buttons.forEach((b, i) => {
      const el = document.createElement("button");
      el.className = "btn";
      el.style.background = b.color || "#333";
      el.innerHTML = `<span class="icon"></span><span class="label"></span>`;
      el.querySelector(".icon").textContent = b.icon || "";
      el.querySelector(".label").textContent = b.label || "";
      el.addEventListener("click", () => press(i, el));
      grid.appendChild(el);
    });
  }

  async function press(i, el) {
    el.classList.add("pressed");
    if (navigator.vibrate) navigator.vibrate(25);
    try {
      const r = await fetch(`/api/press/${i}`, { method: "POST" });
      el.classList.toggle("err", !r.ok);
    } catch { el.classList.add("err"); }
    setTimeout(() => el.classList.remove("pressed", "err"), 600);
  }

  document.querySelectorAll("#np .ctrl button").forEach(b => {
    b.addEventListener("click", async () => {
      if (navigator.vibrate) navigator.vibrate(20);
      try { await fetch(`/api/media/${b.dataset.cmd}`, { method: "POST" }); } catch {}
      setTimeout(updateNp, 250);
    });
  });

  async function updateNp() {
    if (!showNp) { np.classList.remove("show"); return; }
    let d;
    try { d = await (await fetch("/api/nowplaying", { cache: "no-store" })).json(); }
    catch { np.classList.remove("show"); return; }
    if (!d.active || (!d.title && !d.artist)) { np.classList.remove("show"); return; }
    np.classList.add("show");
    document.getElementById("npt").textContent = d.title || "—";
    document.getElementById("npa").textContent = d.artist || "";
    document.getElementById("npplay").textContent = d.playing ? "⏸" : "▶";
    const art = document.getElementById("npart");
    const bg = document.getElementById("npbg");
    const img = d.thumb || "";
    art.style.backgroundImage = img ? `url(${img})` : "";
    bg.style.backgroundImage = img ? `url(${img})` : "";
    if (typeof d.pos === "number" && typeof d.dur === "number" && d.dur > 0)
      document.getElementById("npbar").style.width = (100 * d.pos / d.dur) + "%";
    else document.getElementById("npbar").style.width = "0%";
  }
  setInterval(updateNp, 2000);

  let wasOffline = false;
  setInterval(async () => {
    try {
      const r = await fetch("/api/ping", { cache: "no-store" });
      if (!r.ok) throw 0;
      if (wasOffline) location.reload();
    } catch {
      wasOffline = true;
      offline.classList.add("show");
    }
  }, 2000);

  loadDeck();
  updateNp();
</script>
</body>
</html>
